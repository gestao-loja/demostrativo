<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de Jogadores</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #f4f6f8;
    color: #222;
    padding: 24px;
  }
  h1 { margin-bottom: 20px; color: #1a3d7c; }
  .container { max-width: 1200px; margin: 0 auto; }

  form {
    background: #fff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
  }
  form h2 {
    grid-column: 1 / -1;
    font-size: 1.1rem;
    color: #1a3d7c;
    border-bottom: 2px solid #eef1f5;
    padding-bottom: 8px;
  }
  .field { display: flex; flex-direction: column; }
  .field label { font-size: .8rem; font-weight: 600; margin-bottom: 4px; color: #555; }
  .field input, .field select {
    padding: 8px 10px;
    border: 1px solid #cfd6df;
    border-radius: 6px;
    font-size: .9rem;
    transition: border-color .2s;
  }
  .field input:focus, .field select:focus {
    outline: none;
    border-color: #1a3d7c;
  }
  .actions {
    grid-column: 1 / -1;
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 8px;
  }
  button {
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    font-size: .9rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .2s;
  }
  button:hover { opacity: .85; }
  .btn-primary { background: #1a3d7c; color: #fff; }
  .btn-secondary { background: #e2e8f0; color: #333; }

  table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    font-size: .85rem;
  }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #eef1f5; }
  th { background: #1a3d7c; color: #fff; font-weight: 600; white-space: nowrap; }
  tr:hover td { background: #f9fbfd; }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: .75rem;
    font-weight: 600;
  }
  .badge-Titular    { background: #d1fae5; color: #065f46; }
  .badge-Reserva    { background: #e0e7ff; color: #3730a3; }
  .badge-Emprestado { background: #fef3c7; color: #92400e; }
  .badge-Vendido    { background: #f3f4f6; color: #374151; }
  .badge-Lesionado  { background: #fee2e2; color: #991b1b; }

  .table-actions button {
    padding: 5px 10px;
    font-size: .78rem;
    margin-right: 4px;
  }
  .btn-edit { background: #fbbf24; color: #78350f; }
  .btn-del  { background: #ef4444; color: #fff; }

  .empty-msg {
    text-align: center;
    padding: 30px;
    color: #888;
    background: #fff;
    border-radius: 10px;
  }
  .table-wrap { overflow-x: auto; }
</style>
</head>
<body>
<div class="container">
  <h1>⚽ Cadastro de Jogadores</h1>

  <form id="playerForm">
    <h2 id="formTitle">Novo Jogador</h2>

    <input type="hidden" id="editId">

    <div class="field">
      <label>Nome *</label>
      <input type="text" id="nome" required maxlength="100">
    </div>
    <div class="field">
      <label>Idade *</label>
      <input type="number" id="idade" min="15" max="50" required>
    </div>
    <div class="field">
      <label>Posição Principal *</label>
      <input type="text" id="posicao_principal" required maxlength="30">
    </div>
    <div class="field">
      <label>Posição Jogável</label>
      <input type="text" id="posicao_jogavel" maxlength="100">
    </div>
    <div class="field">
      <label>Nacionalidade *</label>
      <input type="text" id="nacionalidade" required maxlength="60">
    </div>
    <div class="field">
      <label>Melhor Pé *</label>
      <select id="melhor_pe" required>
        <option value="Direito">Direito</option>
        <option value="Esquerdo">Esquerdo</option>
        <option value="Ambos">Ambos</option>
      </select>
    </div>
    <div class="field">
      <label>Altura (cm) *</label>
      <input type="number" id="altura_cm" min="120" max="250" required>
    </div>
    <div class="field">
      <label>Peso (kg) *</label>
      <input type="number" id="peso_kg" step="0.1" min="30" max="150" required>
    </div>
    <div class="field">
      <label>Número da Camisa</label>
      <input type="number" id="numero_camisa" min="1" max="99">
    </div>
    <div class="field">
      <label>Overall *</label>
      <input type="number" id="overall" min="1" max="99" required>
    </div>
    <div class="field">
      <label>Potencial Mínimo *</label>
      <input type="number" id="potencial_minimo" min="1" max="99" required>
    </div>
    <div class="field">
      <label>Potencial Máximo *</label>
      <input type="number" id="potencial_maximo" min="1" max="99" required>
    </div>
    <div class="field">
      <label>Status *</label>
      <select id="status" required>
        <option value="Titular">Titular</option>
        <option value="Reserva">Reserva</option>
        <option value="Emprestado">Emprestado</option>
        <option value="Vendido">Vendido</option>
        <option value="Lesionado">Lesionado</option>
      </select>
    </div>

    <div class="actions">
      <button type="button" class="btn-secondary" id="cancelBtn" style="display:none">Cancelar</button>
      <button type="submit" class="btn-primary" id="submitBtn">Cadastrar</button>
    </div>
  </form>

  <div class="table-wrap">
    <table id="playersTable">
      <thead>
        <tr>
          <th>#</th>
          <th>Nome</th>
          <th>Idade</th>
          <th>Pos. Principal</th>
          <th>Pos. Jogável</th>
          <th>Nacionalidade</th>
          <th>Pé</th>
          <th>Altura</th>
          <th>Peso</th>
          <th>Camisa</th>
          <th>Overall</th>
          <th>Potencial</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="playersBody"></tbody>
    </table>
  </div>
  <p class="empty-msg" id="emptyMsg">Nenhum jogador cadastrado ainda.</p>
</div>

<script>
const STORAGE_KEY = 'jogadores_crud';

let players = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

const $ = id => document.getElementById(id);
const form = $('playerForm');
const tbody = $('playersBody');
const emptyMsg = $('emptyMsg');
const formTitle = $('formTitle');
const submitBtn = $('submitBtn');
const cancelBtn = $('cancelBtn');
const editIdInput = $('editId');

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(players));
}

function nextId() {
  return players.length ? Math.max(...players.map(p => p.id)) + 1 : 1;
}

function render() {
  tbody.innerHTML = '';
  if (!players.length) {
    emptyMsg.style.display = 'block';
    return;
  }
  emptyMsg.style.display = 'none';

  players.forEach(p => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${p.id}</td>
      <td><strong>${escapeHtml(p.nome)}</strong></td>
      <td>${p.idade}</td>
      <td>${escapeHtml(p.posicao_principal)}</td>
      <td>${escapeHtml(p.posicao_jogavel || '—')}</td>
      <td>${escapeHtml(p.nacionalidade)}</td>
      <td>${p.melhor_pe}</td>
      <td>${p.altura_cm} cm</td>
      <td>${p.peso_kg} kg</td>
      <td>${p.numero_camisa ?? '—'}</td>
      <td><strong>${p.overall}</strong></td>
      <td>${p.potencial_minimo}–${p.potencial_maximo}</td>
      <td><span class="badge badge-${p.status}">${p.status}</span></td>
      <td class="table-actions">
        <button class="btn-edit" data-id="${p.id}">Editar</button>
        <button class="btn-del" data-id="${p.id}">Excluir</button>
      </td>
    `;
    tbody.appendChild(tr);
  });

  tbody.querySelectorAll('.btn-edit').forEach(b =>
    b.addEventListener('click', () => editPlayer(+b.dataset.id)));
  tbody.querySelectorAll('.btn-del').forEach(b =>
    b.addEventListener('click', () => deletePlayer(+b.dataset.id)));
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function getFormData() {
  return {
    nome: $('nome').value.trim(),
    idade: +$('idade').value,
    posicao_principal: $('posicao_principal').value.trim(),
    posicao_jogavel: $('posicao_jogavel').value.trim(),
    nacionalidade: $('nacionalidade').value.trim(),
    melhor_pe: $('melhor_pe').value,
    altura_cm: +$('altura_cm').value,
    peso_kg: +$('peso_kg').value,
    numero_camisa: $('numero_camisa').value ? +$('numero_camisa').value : null,
    overall: +$('overall').value,
    potencial_minimo: +$('potencial_minimo').value,
    potencial_maximo: +$('potencial_maximo').value,
    status: $('status').value
  };
}

function fillForm(p) {
  $('nome').value = p.nome;
  $('idade').value = p.idade;
  $('posicao_principal').value = p.posicao_principal;
  $('posicao_jogavel').value = p.posicao_jogavel || '';
  $('nacionalidade').value = p.nacionalidade;
  $('melhor_pe').value = p.melhor_pe;
  $('altura_cm').value = p.altura_cm;
  $('peso_kg').value = p.peso_kg;
  $('numero_camisa').value = p.numero_camisa ?? '';
  $('overall').value = p.overall;
  $('potencial_minimo').value = p.potencial_minimo;
  $('potencial_maximo').value = p.potencial_maximo;
  $('status').value = p.status;
}

function resetForm() {
  form.reset();
  editIdInput.value = '';
  formTitle.textContent = 'Novo Jogador';
  submitBtn.textContent = 'Cadastrar';
  cancelBtn.style.display = 'none';
}

form.addEventListener('submit', e => {
  e.preventDefault();
  const data = getFormData();

  if (data.potencial_maximo < data.potencial_minimo) {
    alert('O potencial máximo deve ser maior ou igual ao mínimo.');
    return;
  }

  const editingId = editIdInput.value ? +editIdInput.value : null;

  if (editingId) {
    const idx = players.findIndex(p => p.id === editingId);
    if (idx !== -1) players[idx] = { ...players[idx], ...data };
  } else {
    players.push({ id: nextId(), ...data });
  }

  save();
  render();
  resetForm();
});

cancelBtn.addEventListener('click', resetForm);

function editPlayer(id) {
  const p = players.find(x => x.id === id);
  if (!p) return;
  fillForm(p);
  editIdInput.value = id;
  formTitle.textContent = `Editar Jogador #${id}`;
  submitBtn.textContent = 'Salvar alterações';
  cancelBtn.style.display = 'inline-block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function deletePlayer(id) {
  const p = players.find(x => x.id === id);
  if (!p) return;
  if (!confirm(`Excluir o jogador "${p.nome}"?`)) return;
  players = players.filter(x => x.id !== id);
  save();
  render();
  if (editIdInput.value && +editIdInput.value === id) resetForm();
}

render();
</script>
</body>
</html>
